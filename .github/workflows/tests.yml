name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DRIVER_URL: "http://localhost:4444/wd/hub"

defaults:
  run:
    shell: bash

jobs:
  check_composer:
    name: Check composer.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          coverage: none
          php-version: '8.5'
      - run: composer validate --strict --no-check-lock

  static_analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          coverage: none
          php-version: '8.5'
      - name: Install dependencies
        run: composer update --ansi --no-progress --prefer-dist --no-interaction
      - run: vendor/bin/phpstan analyze

  tests:
    name: "Tests (PHP ${{ matrix.php }}, ${{ matrix.browser }}, Selenium ${{ matrix.selenium_version }})${{ matrix.with_coverage == true && ' with coverage' || ''}}"
    runs-on: ubuntu-latest
    env:
      # Selenium 3 runs on the runner with latest browser versions, other versions use Docker images with bundled browsers
      SELENIUM_IN_DOCKER: ${{ matrix.selenium_version != '3' }}
    strategy:
      matrix:
        browser: [ 'firefox' ]
        selenium_version: [ '2.53.1' ]
        php: [ '7.2', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
        with_coverage: [ false ]
        include:
          # Cover code paths for PHP < 7.4
          - browser: 'firefox'
            selenium_version: '2.53.1'
            php: '7.3'
            with_coverage: true
          # Check each browser on each supported Selenium version
          - browser: 'firefox'
            selenium_version: '2.53.1'
            php: '8.5'
            with_coverage: true
          - browser: 'firefox'
            selenium_version: '3'
            php: '8.5'
            with_coverage: true
          - browser: 'chrome'
            selenium_version: '2.53.1'
            php: '8.5'
            with_coverage: false
          - browser: 'chrome'
            selenium_version: '3'
            php: '8.5'
            with_coverage: false
          # Check that unsupported Selenium version is rejected
          - browser: 'firefox'
            selenium_version: '4'
            php: '8.5'
            with_coverage: true
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          coverage: "xdebug"
          php-version: "${{ matrix.php }}"
          tools: composer
          ini-file: 'development'
          # PHP 7.1 development web server segfaults if timezone not set.
          ini-values: date.timezone=Europe/Paris

      - name: Install dependencies
        run: |
          composer update --no-interaction --prefer-dist

      - name: Setup Mink test server
        env:
          MINK_HOST: 0.0.0.0:8002
        run: |
          mkdir ./logs
          ./vendor/bin/mink-test-server &> ./logs/mink-test-server.log &

      - name: Setup Chrome
        id: setup-chrome
        if: ${{ env.SELENIUM_IN_DOCKER == 'false' && matrix.browser == 'chrome' }}
        uses: browser-actions/setup-chrome@v2
        with:
          install-chromedriver: true

      - name: Setup Firefox
        id: setup-firefox
        if: ${{ env.SELENIUM_IN_DOCKER == 'false' && matrix.browser == 'firefox' }}
        uses: browser-actions/setup-firefox@v1

      - name: Start Selenium in Docker
        if: ${{ env.SELENIUM_IN_DOCKER == 'true' }}
        run: |
          SELENIUM_IMAGE=selenium/standalone-${{ matrix.browser }}:${{ matrix.selenium_version }} docker compose up --wait
          echo "WEB_FIXTURES_HOST=http://host.docker.internal:8002" >> "$GITHUB_ENV"
          echo "DRIVER_MACHINE_BASE_PATH=/fixtures/" >> "$GITHUB_ENV"

      - name: Start Selenium on runner
        if: ${{ env.SELENIUM_IN_DOCKER == 'false' }}
        env:
          BROWSER_BINARY: ${{ steps.setup-chrome.outputs.chrome-path || steps.setup-firefox.outputs.firefox-path }}
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: |
          curl -sSLO https://github.com/SeleniumHQ/selenium/releases/download/selenium-3.141.59/selenium-server-standalone-3.141.59.jar
          xvfb-run -a java -Dwebdriver.chrome.driver="$CHROMEDRIVER_PATH" -Dwebdriver.gecko.driver="$GECKOWEBDRIVER/geckodriver" -jar selenium-server-standalone-3.141.59.jar &> ./logs/selenium.log &
          echo "WEB_FIXTURES_HOST=http://localhost:8002" >> "$GITHUB_ENV"
          echo "BROWSER_BINARY=$BROWSER_BINARY" >> "$GITHUB_ENV"

      - name: Wait for browser & PHP to start
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 1 --max-time 10 --head -X GET http://localhost:4444/wd/hub/status
          curl --retry 5 --retry-all-errors --retry-delay 1 --max-time 10 --head -X GET http://localhost:8002/index.html

      - name: Show browser version
        run: |
          if [ "$SELENIUM_IN_DOCKER" = true ]; then
            docker compose exec selenium sh -c 'google-chrome --version || chromium --version || microsoft-edge --version || firefox --version' 2>/dev/null
          else
            "$BROWSER_BINARY" --version
          fi

      - name: Run tests with Coverage
        if: "${{ matrix.with_coverage == true }}"
        env:
          SELENIUM_VERSION: ${{ matrix.selenium_version }}
          DRIVER_URL: http://localhost:4444/wd/hub
          WEB_FIXTURES_BROWSER: ${{ matrix.browser }}
        run: |
          vendor/bin/phpunit -v --coverage-clover=coverage.xml --log-junit junit.xml

      - name: Run tests without Coverage
        if: "${{ matrix.with_coverage == false }}"
        env:
          SELENIUM_VERSION: ${{ matrix.selenium_version }}
          DRIVER_URL: http://localhost:4444/wd/hub
          WEB_FIXTURES_BROWSER: ${{ matrix.browser }}
        run: |
          vendor/bin/phpunit -v --log-junit junit.xml

      - name: Upload coverage to Codecov
        if: ${{ matrix.with_coverage == true && !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          report_type: test_results

      - name: Extract docker logs
        if: ${{ failure() && env.SELENIUM_IN_DOCKER == 'true' }}
        run: |
          docker compose logs --no-color &> ./logs/selenium.log

      - name: Archive logs artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: logs_php-${{ matrix.php }}_selenium-${{ matrix.selenium_version }}_${{ matrix.browser }}
          path: |
            logs
